name: Legacy search cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legacy-search-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and enrich legacy page metadata
        run: |
          sed -i 's#htyps://linktr.ee/questrequestvr#https://linktr.ee/questrequestvr#g' index.html
          sed -i '/<meta name="viewport"/a\    <meta name="description" content="Quest-XSA by Joe Nasr explores Meta Quest 3 thermal and UV sensor integration, mixed reality, sensory augmentation and spatial computing.">\n    <meta name="author" content="Joe Nasr">\n    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">\n    <link rel="canonical" href="https://joenasriani.github.io/quest-xsa/">' index.html
      - name: Commit change
        run: |
          git config user.name "Joe Nasr Research Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair legacy link and add search metadata"
          git push
